<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>CREATOR NEXT GEN · ROV Creator Calculator Pro</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
        }

        body {
            background: #0a0503;
            background-image:
                radial-gradient(circle at 20% 20%, #4a2c14 0%, #1f0e06 70%),
                radial-gradient(circle at 80% 80%, #5a3a1e 0%, #160b07 90%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 12px 32px;
            color: #fbeed3;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated glowing orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            z-index: 0;
            animation: float 8s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb-1 {
            width: 180px;
            height: 180px;
            background: #f3b33d;
            top: 20%;
            left: -5%;
            animation-duration: 10s;
        }
        .orb-2 {
            width: 220px;
            height: 220px;
            background: #a567f0;
            bottom: 10%;
            right: -10%;
            animation-duration: 12s;
        }
        .orb-3 {
            width: 150px;
            height: 150px;
            background: #ff7b00;
            top: 60%;
            left: 20%;
            animation-duration: 9s;
            opacity: 0.3;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.2); }
        }

        .app-container {
            max-width: 480px;
            width: 100%;
            background: rgba(26, 14, 8, 0.92);
            background: linear-gradient(160deg, #3e2815 0%, #1a0d06 100%);
            border-radius: 42px 42px 32px 32px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 180, 70, 0.4), inset 0 1px 5px rgba(255, 215, 130, 0.4);
            padding: 20px 16px 28px;
            border: 2px solid #ffc44d;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(2px);
            transition: transform 0.2s;
        }

        .app-container:hover {
            transform: translateY(-2px);
        }

        /* Shine overlay */
        .app-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            animation: shine 4s infinite;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes shine {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .content-layer {
            position: relative;
            z-index: 3;
        }

        /* ===== HEADER ===== */
        .header-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 100px;
            padding: 12px 20px;
            margin-bottom: 18px;
            border: 1.5px solid #ffd166;
            box-shadow: 0 0 20px rgba(255, 190, 80, 0.5), inset 0 0 10px rgba(255, 210, 120, 0.3);
            transition: box-shadow 0.3s;
        }

        .header-card:hover {
            box-shadow: 0 0 35px rgba(255, 190, 80, 0.9);
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffe9b8, #ffbb4d, #ff8800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px #ffae1a;
        }

        .token-badge {
            background: #3b2312;
            border: 2px solid #f7c873;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff3d1;
            box-shadow: 0 0 15px #ffb347, inset 0 0 8px rgba(255,215,130,0.6);
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); box-shadow: 0 0 25px #ffb347; }
            100% { transform: scale(1); }
        }

        /* ===== CREATOR STATUS CARD ===== */
        .status-card {
            background: linear-gradient(125deg, #4a2e16, #2b1b0e);
            border-radius: 28px;
            padding: 18px 18px;
            margin-bottom: 20px;
            border: 1px solid #d69e4a;
            box-shadow: 0 8px 0 #6b471f, 0 12px 30px black, inset 0 0 20px rgba(255,180,70,0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .creator-level {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            background: #1a0f06;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 1rem;
            color: #ffd58c;
            border: 1px solid #e6a53e;
            box-shadow: inset 0 2px 5px rgba(255,200,80,0.2);
        }

        .point-display {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            background: #0f0804;
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid #bc7e34;
            box-shadow: inset 0 0 10px rgba(255,180,70,0.3);
        }

        .point-display strong {
            color: #ffdb8e;
            text-shadow: 0 0 8px #ffaa33;
        }

        /* ===== TARGET SECTION ===== */
        .target-section {
            background: linear-gradient(145deg, #422a12, #2b1a0d);
            border-radius: 26px;
            padding: 20px 16px;
            margin-bottom: 20px;
            border: 1px solid #e5a94b;
            box-shadow: 0 6px 0 #8a581b, 0 10px 25px black, inset 0 0 15px rgba(255,170,70,0.3);
        }

        .target-input {
            width: 100%;
            background: #1e1108;
            border: 2px solid #f5b84b;
            border-radius: 40px;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fdebcd;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
            box-shadow: inset 0 0 15px rgba(255,190,80,0.4);
            transition: 0.3s;
        }
        .target-input:focus {
            border-color: #ffd166;
            box-shadow: 0 0 25px #ffb347, inset 0 0 10px rgba(255,255,200,0.6);
            background: #2a190b;
        }
        .target-input::placeholder {
            color: #b99f7c;
            font-weight: 500;
        }

        .btn-calculate {
            background: linear-gradient(145deg, #ffc95e, #f28c1c);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.2rem;
            color: #2d1904;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 0 #9b5a16, 0 10px 25px black, 0 0 15px rgba(255,180,80,0.6);
            transition: 0.1s ease;
            border: 1px solid #ffe5a1;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .btn-calculate::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shine 2s infinite;
        }
        .btn-calculate:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #9b5a16, 0 6px 15px black;
        }

        /* ===== TOKEN SUMMARY ===== */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .summary-item {
            background: linear-gradient(145deg, #2b1a0d, #1a0f06);
            border-radius: 20px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid #d49a3f;
            box-shadow: 0 5px 0 #6b471f, 0 8px 15px black, inset 0 0 10px rgba(255,180,70,0.3);
            transition: 0.3s;
        }
        .summary-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #6b471f, 0 12px 25px black, 0 0 15px #ffb347;
        }
        .summary-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #e0b56b;
            letter-spacing: 1px;
        }
        .summary-value {
            font-size: 2rem;
            font-weight: 900;
            color: #ffe8be;
            line-height: 1.2;
            text-shadow: 0 0 12px #ffb347;
        }

        /* ===== MISSION CENTER ===== */
        .section-title {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(180deg, #fff1cf, #f7b843, #ff8800);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 25px 0 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 15px #ffae1a;
        }

        .mission-card {
            background: linear-gradient(135deg, #2a1a0c, #1f1309);
            border-left: 8px solid #ff9d2e;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 6px 0 #7a4b19, 0 12px 25px black, inset 0 0 12px rgba(255,180,70,0.3);
            transition: 0.3s;
        }
        .mission-card:hover {
            transform: translateX(4px);
            border-left-color: #ffc44d;
            box-shadow: 0 6px 0 #7a4b19, 0 15px 30px black, 0 0 20px #ffb347;
        }

        .mission-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #ffddaa;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        .reward-pill {
            background: linear-gradient(145deg, #6b431a, #5a3a1e);
            padding: 5px 16px;
            border-radius: 20px;
            font-weight: 900;
            border: 1px solid #fbb44c;
            box-shadow: inset 0 0 8px rgba(255,200,80,0.5);
        }
        .mission-progress {
            color: #cfab79;
            font-size: 0.9rem;
        }
        .btn-mission {
            background: linear-gradient(145deg, #f5a623, #d9881c);
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            font-weight: bold;
            margin-top: 8px;
            cursor: default;
            box-shadow: 0 4px 0 #8a581b, 0 5px 15px black;
            color: #161007;
        }
        .btn-mission.completed {
            background: linear-gradient(145deg, #4caf50, #2e7d32);
            color: white;
            box-shadow: 0 4px 0 #1b5e20, 0 5px 15px black;
        }

        /* ===== ONE-TIME REWARDS ===== */
        .reward-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .reward-card {
            background: linear-gradient(145deg, #36230f, #2f1f10);
            border-radius: 18px;
            padding: 12px;
            flex: 1 0 40%;
            border: 1px solid #d49a3f;
            text-align: center;
            box-shadow: 0 4px 0 #6b471f, 0 6px 15px black, inset 0 0 8px rgba(255,180,70,0.3);
            transition: 0.2s;
        }
        .reward-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #6b471f, 0 10px 20px black, 0 0 15px #ffb347;
        }
        .reward-name {
            font-size: 0.8rem;
            color: #efc68c;
            font-weight: bold;
        }
        .reward-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffd966;
            text-shadow: 0 0 10px #ffaa33;
        }
        .reward-status {
            font-size: 0.75rem;
            background: #1e160c;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 6px;
            border: 1px solid #d49a3f;
        }

        /* ===== AI STRATEGY ===== */
        .ai-strategy {
            background: linear-gradient(145deg, #2b1a0d, #1a0f06);
            border-radius: 28px;
            padding: 18px;
            border: 1px solid #d69e4a;
            margin: 20px 0;
            box-shadow: 0 6px 0 #6b471f, 0 10px 30px black, inset 0 0 15px rgba(255,180,70,0.3);
        }

        .strategy-card {
            background: linear-gradient(145deg, #432b13, #35200e);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            border: 2px solid #f5b84b;
            box-shadow: 0 6px 0 #6b471f, 0 10px 20px black;
            transition: 0.2s;
        }
        .strategy-card.recommended {
            border: 3px solid #ffc44d;
            background: linear-gradient(145deg, #5a3a1a, #4a3418);
            box-shadow: 0 6px 0 #9b6a1f, 0 0 30px rgba(255,180,70,0.7);
            position: relative;
        }
        .strategy-card.recommended::before {
            content: "⭐ RECOMMENDED";
            position: absolute;
            top: -15px;
            right: 15px;
            background: #ffc44d;
            color: #2d1904;
            font-weight: 900;
            font-size: 0.7rem;
            padding: 5px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px black;
        }

        .strategy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd58c;
        }
        .strategy-badge {
            background: #8b5a1e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #fff;
            border: 1px solid #fbb44c;
        }

        .strategy-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        .strategy-item {
            background: #1d1309;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #6b471f;
        }
        .strategy-item-label {
            font-size: 0.7rem;
            color: #c9a86a;
            text-transform: uppercase;
        }
        .strategy-item-value {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffe9b8;
        }

        .strategy-formula {
            background: #1a0f06;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #d4b892;
            border-left: 4px solid #f7b843;
        }
        .strategy-explanation {
            font-size: 0.85rem;
            color: #e0c9a8;
            margin-top: 8px;
        }

        .strategy-analysis {
            margin-top: 10px;
            padding: 10px;
            background: #2b1a0d;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.75rem;
            color: #f0d9b0;
        }
        .analysis-tag {
            background: #543b1e;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #e6a53e;
            white-space: nowrap;
        }

        .forecast-box {
            background: #1d1309;
            border-radius: 24px;
            padding: 18px;
            border: 1px solid #b17e39;
            box-shadow: 0 5px 0 #6b471f, 0 10px 25px black, inset 0 0 15px rgba(255,180,70,0.2);
        }
        .forecast-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 1.1rem;
            color: #fbeed3;
        }

        hr {
            border: 0.5px solid #634e2c;
            margin: 16px 0;
        }
        .tiny-note {
            font-size: 0.75rem;
            color: #bba276;
            text-align: center;
        }
    </style>
</head>

    <div class="orb orb-3"></div>

    <div class="app-container">
