<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RoV Creator Calculator PRO V2</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f4f6;
padding:20px;
}

.card{
background:white;
max-width:800px;
margin:auto;
padding:20px;
border-radius:16px;
box-shadow:0 4px 20px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:20px;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

input,select{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.result{
margin-top:20px;
background:#eef2ff;
padding:20px;
border-radius:12px;
white-space:pre-line;
line-height:1.8;
}

.table{
margin-top:20px;
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

th{
background:#2563eb;
color:white;
}

.dark{
background:#111827;
color:white;
}

.dark .card{
background:#1f2937;
color:white;
}

.dark input,
.dark select{
background:#374151;
color:white;
border:none;
}

.dark .result{
background:#374151;
}

.dark table{
color:white;
}

.dark th{
background:#1d4ed8;
}
</style>

</head>
<body>

<div class="card">

<h1>RoV Creator Calculator PRO V2</h1>

<label>Point ที่ต้องการ</label>
<input id="point" type="number" placeholder="เช่น 1000">

<label>รูปแบบการปั้ม</label>
<select id="mode">
<option value="economy">สายประหยัดวิว</option>
<option value="normal">สายกลาง</option>
<option value="fast">สายวิวสูงคลิปน้อย</option>
</select>

<button onclick="calculate()">คำนวณ</button>

<button onclick="copyResult()">คัดลอกผลลัพธ์</button>

<button onclick="toggleDark()">Dark Mode</button>

<div id="result" class="result"></div>

<div class="table">
<h2 style="margin-top:20px">ตารางแลก Point</h2>

<table>
<tr>
<th>Point</th>
<th>Token</th>
</tr>

<tr><td>100</td><td>80</td></tr>
<tr><td>300</td><td>210</td></tr>
<tr><td>500</td><td>360</td></tr>
<tr><td>1000</td><td>720</td></tr>
<tr><td>1500</td><td>1090</td></tr>
<tr><td>2000</td><td>1430</td></tr>

</table>
</div>

</div>

<script>

const rewardTable = {
100:80,
300:210,
500:360,
1000:720,
1500:1090,
2000:1430
};

function calculate(){

let point=parseInt(document.getElementById("point").value);

let target=rewardTable[point];

if(!target){
document.getElementById("result").innerText=
"รองรับเฉพาะ 100, 300, 500, 1000, 1500, 2000 Point";
return;
}

let mode=document.getElementById("mode").value;

let viewsPerClip=40000;

if(mode==="economy"){
viewsPerClip=20000;
}

if(mode==="normal"){
viewsPerClip=40000;
}

if(mode==="fast"){
viewsPerClip=80000;
}

let clips=1;

while(true){

let tokenViews=clips*38;

let clipBonus=
clips>=15?50:
clips>=10?40:
clips>=5?30:
clips>=2?20:
clips>=1?10:0;

let monthlyViewBonus=60;
let monthlyMissionBonus=60;
let likeBonus=15;
let followerBonus=5;

let total=
tokenViews+
clipBonus+
monthlyViewBonus+
monthlyMissionBonus+
likeBonus+
followerBonus;

if(total>=target){

let totalViews=clips*viewsPerClip;

document.getElementById("result").innerText=`

เป้าหมาย ${point} Point

ต้องใช้ ${target} Token

━━━━━━━━━━

แผนแนะนำ

จำนวนคลิป : ${clips}

วิวต่อคลิป : ${viewsPerClip.toLocaleString()}

วิวรวม : ${totalViews.toLocaleString()}

━━━━━━━━━━

Token จากวิว : ${tokenViews}

โบนัสคลิป : ${clipBonus}

โบนัสวิวสะสม : ${monthlyViewBonus}

โบนัสภารกิจ : ${monthlyMissionBonus}

Like : ${likeBonus}

Follower : ${followerBonus}

━━━━━━━━━━

รวม Token : ${total}

`;

break;
}

clips++;

}

}

function copyResult(){

let text=document.getElementById("result").innerText;

navigator.clipboard.writeText(text);

alert("คัดลอกแล้ว");
}

function toggleDark(){

document.body.classList.toggle("dark");

}

</script>

</body>
</html>
