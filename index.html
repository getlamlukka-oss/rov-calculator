<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CREATOR NEXT GEN - FULL</title>
<style>
:root{--bg:#0b1020;--card:#121a2f;--text:#fff;--accent:#ff9800}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px;background:linear-gradient(135deg,#ff9800,#8e24aa)}
.wrap{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--card);padding:16px;border-radius:16px}
input,textarea,select,button{width:100%;padding:10px;margin-top:8px;border-radius:10px;border:0}
button{background:var(--accent);color:#fff;font-weight:bold}
.progress{height:16px;background:#333;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:#22c55e}
</style>
</head>
<body>
<header><h1>CREATOR NEXT GEN</h1><p>ROV Creator Calculator Pro</p></header>
<div class="wrap">
<div class="grid">
<div class="card">
<h3>Calculator</h3>
<input id="currentPoint" type="number" placeholder="Current Point">
<select id="targetPoint">
<option>100</option><option>300</option><option>500</option>
<option>1000</option><option>1500</option><option>2000</option>
</select>
<textarea id="views" rows="8" placeholder="1 คลิปต่อ 1 บรรทัด"></textarea>
<button onclick="calc()">Calculate</button>
</div>
<div class="card">
<h3>One-Time Rewards</h3>
<div id="rewards"></div>
</div>
<div class="card">
<h3>Progress</h3>
<div class="progress"><div class="bar" id="bar"></div></div>
<p id="percent">0%</p>
<div id="summary"></div>
</div>
</div>
</div>
<script>
const POINTS={100:80,300:210,500:360,1000:720,1500:1090,2000:1430};
const rewards=[["Upload Clips",40],["Highest Video Views",20],["Highest Video Likes",15],["Followers",15],["Connect TikTok",10],["Upload RoV Clip",10],["RoV Mission",10]];
document.getElementById("rewards").innerHTML=rewards.map(r=>`<label><input class="rw" type="checkbox" data-token="${r[1]}"> ${r[0]} (+${r[1]})</label><br>`).join("");
function viewToken(v){let t=0;if(v>=1000)t+=3;if(v>=4000)t+=5;if(v>=15000)t+=10;if(v>=40000)t+=20;return t;}
function calc(){
 let reward=[...document.querySelectorAll('.rw')].reduce((a,b)=>a+(b.checked?+b.dataset.token:0),0);
 let vt=0,clips=0;
 views.value.split(/\n/).forEach(x=>{let v=parseInt(x);if(v>0){clips++;vt+=viewToken(v)}});
 let req=POINTS[+targetPoint.value]||0;
 let cur=reward+vt;
 let rem=Math.max(0,req-cur);
 let p=req?Math.min(cur/req*100,100):0;
 bar.style.width=p+'%';
 percent.textContent=p.toFixed(2)+'%';
 summary.innerHTML=`Required:${req}<br>Current:${cur}<br>Remaining:${rem}<br>Clips:${clips}`;
 localStorage.setItem("creator_next_gen_full",JSON.stringify({cp:currentPoint.value,tp:targetPoint.value,views:views.value}));
}
</script>
</body></html>
